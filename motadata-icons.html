Object.entries(cats).forEach(([cat,icons])=>{
const shown=icons.filter(i=>!f||i.name.toLowerCase().includes(f)||i.cat.toLowerCase().includes(f)||i.desc.toLowerCase().includes(f));
if(!shown.length)return;
const sec=document.createElement('div');sec.className='category';
sec.innerHTML=`<div class="category-title">${cat}</div><div class="category-count">${shown.length} icon${shown.length>1?'s':''}</div>`;
const grid=document.createElement('div');grid.className='grid';
shown.forEach(i=>{
const card=document.createElement('div');card.className='icon-card';
card.innerHTML=`<div class="icon-box">${i.svg36}</div><div class="icon-name">${i.name}</div><div class="icon-desc">${i.desc}</div><div class="dl-btns"><button class="dl-btn" onclick="dl36(this)">SVG 36</button><button class="dl-btn" onclick="dl16(this)">SVG 16</button><button class="dl-btn" onclick="copySvg(this)">Copy</button></div>`;
card.dataset.svg=i.svg36;card.dataset.name=i.name;
grid.appendChild(card)});
sec.appendChild(grid);c.appendChild(sec)})
}

function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'')}

function dl36(btn){
const card=btn.closest('.icon-card');
const a=document.createElement('a');
a.download=slug(card.dataset.name)+'-36.svg';
a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(card.dataset.svg);
a.click();toast('Downloaded 36×36')}

function dl16(btn){
const card=btn.closest('.icon-card');
const s=card.dataset.svg.replace(/viewBox="0 0 36 36"/,'viewBox="0 0 36 36"').replace(/width="36"/,'width="16"').replace(/height="36"/,'height="16"');
const a=document.createElement('a');
a.download=slug(card.dataset.name)+'-16.svg';
a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
a.click();toast('Downloaded 16×16')}

function copySvg(btn){
const card=btn.closest('.icon-card');
navigator.clipboard.writeText(card.dataset.svg).then(()=>toast('SVG copied!'))}

function downloadAll36(){
const svgs=ICONS.map(i=>i.svg36);
const blob=new Blob([svgs.join('\n\n')],{type:'image/svg+xml'});
